name: ci

# After a merge only. The repository is public, so a pull request, an issue or a
# comment from anyone must trigger nothing; only a push to main, which only
# collaborators can make, runs the checks, and only on our own runners.
on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-main
  cancel-in-progress: false

jobs:
  check:
    name: fmt, clippy, test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            runner: [self-hosted, linux, bridge-local]
          - os: windows
            runner: [self-hosted, windows, bridge-windows]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup default stable
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --locked
      - name: Release build
        run: cargo build --release --locked
      - name: Upload the Windows executable
        # The build of main, for trying it on Windows before a release.
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: oschess-bridge-windows
          path: target/release/oschess-bridge.exe
          if-no-files-found: error
          retention-days: 14
