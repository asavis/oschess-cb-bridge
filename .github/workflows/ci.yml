name: ci

# After a merge only. The repository is public, so a pull request, an issue or a
# comment from anyone must trigger nothing; only a push to main, which only
# collaborators can make, runs the checks, and only on our own runners.
on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-main
  cancel-in-progress: false

jobs:
  check:
    name: fmt, clippy, test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            runner: [self-hosted, linux, bridge-local]
          - os: windows
            runner: [self-hosted, windows, bridge-windows]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain
        # The version, components and targets rust-toolchain.toml names.
        run: |
          rustup toolchain install
          rustc --version
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --locked --no-fail-fast
      - name: Script tests
        # The Store package's version, the app's as Cargo reads it and its
        # mapping, and the packing steps (scripts/test_msix.py); the stress
        # runner's parsing and report (scripts/test_stress.py).
        if: runner.os == 'Linux'
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Declared minimum Rust
        # Cargo.toml's rust-version names the pinned toolchain, the only
        # compiler anything is built with, so it stays true without a second
        # toolchain. A bump that moves one and not the other fails here.
        if: runner.os == 'Linux'
        run: |
          minimum=$(sed -n 's/^rust-version = "\(.*\)"$/\1/p' Cargo.toml)
          channel=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)
          if [ -z "$minimum" ] || [ "$minimum" != "$channel" ]; then
            echo "::error::rust-version '$minimum' in Cargo.toml differs from channel '$channel' in rust-toolchain.toml; bump both together"
            exit 1
          fi
      - name: Tauri CLI of the lock
        # release.yml's TAURI_CLI_VERSION is the CLI of the tauri crates in
        # Cargo.lock: `cargo install --locked` builds it with the tauri-utils
        # its published Cargo.lock names, which must be the one in ours. A
        # tauri bump that leaves the CLI behind fails here, before a tag.
        if: runner.os == 'Linux'
        run: |
          tauri_utils() { sed -n '/^name = "tauri-utils"$/{n;s/^version = "\(.*\)"$/\1/p;}' "$1"; }
          cli=$(sed -n 's/^  TAURI_CLI_VERSION: \(.*\)$/\1/p' .github/workflows/release.yml)
          if [ -z "$cli" ]; then
            echo "::error::release.yml names no TAURI_CLI_VERSION"
            exit 1
          fi
          curl -fsSL --retry 3 --max-time 120 -o "$RUNNER_TEMP/tauri-cli.crate" \
            "https://static.crates.io/crates/tauri-cli/tauri-cli-$cli.crate"
          tar -xzOf "$RUNNER_TEMP/tauri-cli.crate" "tauri-cli-$cli/Cargo.lock" > "$RUNNER_TEMP/tauri-cli.lock"
          ours=$(tauri_utils Cargo.lock)
          theirs=$(tauri_utils "$RUNNER_TEMP/tauri-cli.lock")
          if [ -z "$ours" ] || [ "$ours" != "$theirs" ]; then
            echo "::error::tauri-cli $cli is built with tauri-utils '$theirs', and Cargo.lock has tauri-utils '$ours': set TAURI_CLI_VERSION in release.yml to the CLI of the tauri crates in Cargo.lock"
            exit 1
          fi
          echo "tauri-cli $cli is built with tauri-utils $ours, the one in Cargo.lock"
      - name: Release build
        # The whole workspace: on Windows, the tray app (crates/app) and the
        # console bridge (crates/bridge) among the rest.
        run: cargo build --release --locked
      - name: Upload the tray app
        # The build of main, for trying the app that ships on Windows before a
        # release. It keeps its cargo name, oschess-bridge-app.exe: only the
        # release's Tauri CLI build renames it to oschess-bridge.exe.
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: oschess-bridge-tray-app-windows
          path: target/release/oschess-bridge-app.exe
          if-no-files-found: error
          retention-days: 14
      - name: Upload the console bridge
        # crates/bridge's oschess-bridge.exe, the same bridge in a console, as
        # the README runs it. Not the release's oschess-bridge.exe, which is
        # the tray app renamed.
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: oschess-bridge-console-windows
          path: target/release/oschess-bridge.exe
          if-no-files-found: error
          retention-days: 14
