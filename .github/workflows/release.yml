name: release

# A tag vX.Y.Z whose version matches the bridge crate publishes
# oschess-bridge.exe and its SHA-256 on the repository's Releases page.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  windows:
    name: build and publish oschess-bridge.exe
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          rustup toolchain install stable --profile minimal --target x86_64-pc-windows-msvc
          rustup default stable
      - name: The tag names the crate's version
        shell: pwsh
        run: |
          $metadata = cargo metadata --no-deps --format-version 1 --locked | ConvertFrom-Json
          $version = ($metadata.packages | Where-Object name -eq 'bridge').version
          if ("v$version" -ne $env:GITHUB_REF_NAME) {
            throw "tag $env:GITHUB_REF_NAME does not match the bridge crate's version $version"
          }
      - name: Test
        run: cargo test --locked
      - name: Build
        run: cargo build --release --locked --target x86_64-pc-windows-msvc
      - name: Checksum and notes
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/x86_64-pc-windows-msvc/release/oschess-bridge.exe dist/
          $hash = (Get-FileHash dist/oschess-bridge.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -NoNewline -Encoding ascii dist/oschess-bridge.exe.sha256 "$hash  oschess-bridge.exe`n"
          $notes = @(
            "The oschess bridge $env:GITHUB_REF_NAME for Windows 10 and 11 (64-bit).",
            '',
            "SHA-256 of ``oschess-bridge.exe``: ``$hash``",
            '',
            'The executable is not signed yet, so Windows SmartScreen warns before the first start.',
            'See the [README](https://github.com/asavis/oschess-cb-bridge#install-on-windows) for how to check the download, start it and allow the browser to reach it.'
          )
          Set-Content -Encoding utf8 dist/notes.md ($notes -join "`n")
      - name: Publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:GITHUB_REF_NAME dist/oschess-bridge.exe dist/oschess-bridge.exe.sha256 `
            --title "oschess bridge $env:GITHUB_REF_NAME" --notes-file dist/notes.md --verify-tag
