[package]
name = "cbtool"
description = "Inspect, verify and export ChessBase chess databases (.2cbh and classic .cbh), and run the oschess bridge in a console"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
bridge = { version = "0.1.0", path = "../bridge" }
cbformat = { version = "0.1.0", path = "../cbformat" }
chesscore = { version = "0.1.0", path = "../chesscore" }
same-file = "1"

[dev-dependencies]
cbformat = { version = "0.1.0", path = "../cbformat", features = ["fixture"] }
