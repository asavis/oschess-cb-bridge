# The toolchain every build uses: local checks, CI and releases (#64). Bumping
# it is a pull request of its own, which also fixes the lints the new version
# brings and moves `rust-version` in Cargo.toml to the same version: nothing
# builds with an older compiler, so the declared minimum is this channel. CI
# fails when the two differ.
[toolchain]
channel = "1.98.1"
profile = "minimal"
components = ["clippy", "rustfmt"]
targets = ["x86_64-pc-windows-msvc"]
